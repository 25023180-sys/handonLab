name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4 # Cập nhật lên v4 cho mới nhất

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean install # Bước này đã bao gồm Checkstyle và Unit Test

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-jar
          path: target/*.jar